<div class="form-container">
  <h2>Inicio de Sesión</h2>

  <div *ngIf="mensajeRegistro" class="success-alert" role="status">
    {{ mensajeRegistro }}
  </div>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
    <!-- Correo electrónico -->
    <div class="form-group">
      <label for="email">Correo Electrónico:</label>
      <input
        type="email"
        id="email"
        formControlName="email"
        class="form-control"
        placeholder="Ingrese su correo"
        autocomplete="email"
      />
      <div *ngIf="f['email'].touched && f['email'].invalid" class="error-text">
        <small *ngIf="f['email'].errors?.['required']">El correo es obligatorio.</small>
        <small *ngIf="f['email'].errors?.['email']">Ingrese un correo válido.</small>
      </div>
    </div>

    <!-- Contraseña -->
    <div class="form-group">
      <label for="password">Contraseña:</label>
      <input
        type="password"
        id="password"
        formControlName="password"
        class="form-control"
        placeholder="Ingrese su contraseña"
        autocomplete="current-password"
      />
      <div *ngIf="f['password'].touched && f['password'].invalid" class="error-text">
        <small *ngIf="f['password'].errors?.['required']">La contraseña es obligatoria.</small>
      </div>
    </div>

    <div *ngIf="mensajeError" class="error-alert" role="alert">
      {{ mensajeError }}
    </div>

    <button type="submit" class="btn-submit">
      Iniciar Sesión
    </button>
  </form>

  <p class="register-link">
    ¿No tienes una cuenta?
    <a (click)="irRegistro()">Regístrate aquí</a>
  </p>
</div>
